version: '3.8'

services:
  # 1. 核心持久化数据库 (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: maintainwise-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maintainwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MaintainWisePg2026}
      POSTGRES_DB: ${POSTGRES_DB:-maintainwise_db}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maintainwise} -d ${POSTGRES_DB:-maintainwise_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maintainwise-network

  # 2. 高速缓存与任务队列 (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: maintainwise-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-MaintainWiseRedis2026}" --appendonly yes
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-MaintainWiseRedis2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maintainwise-network

  # 3. 后端 API 服务与调度中心 (FastAPI / Python)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: maintainwise-backend:v1.0
    container_name: maintainwise-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maintainwise}:${POSTGRES_PASSWORD:-MaintainWisePg2026}@postgres:5432/${POSTGRES_DB:-maintainwise_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-MaintainWiseRedis2026}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-maintainwise_super_secret_jwt_key_2026_change_me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 50
      RUN_MODE: docker_production
      RUN_BACKGROUND_SCHEDULER: "true"
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maintainwise-network

  # 4. 前端应用服务 (Vue 3 + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: maintainwise-frontend:v1.0
    container_name: maintainwise-frontend
    restart: always
    networks:
      - maintainwise-network

  # 5. 反向代理与流量网关 (Nginx Gateway)
  gateway:
    image: nginx:1.25-alpine
    container_name: maintainwise-gateway
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - maintainwise-network

volumes:
  pgdata:
    name: maintainwise_pgdata
  redisdata:
    name: maintainwise_redisdata
  uploads:
    name: maintainwise_uploads

networks:
  maintainwise-network:
    name: maintainwise-network
    driver: bridge
